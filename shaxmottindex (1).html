<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shaxmat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{--bg:#262421;--panel:#312e2b;--text:#fff;--muted:#a3a19e;--accent:#81b64c;--gold:#81b64c;
--lt:#eeeed2;--dk:#769656;--board:min(94vw,480px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;
padding:calc(env(safe-area-inset-top,0px) + 10px) 0 calc(env(safe-area-inset-bottom,0px) + 16px)}
h1{margin:0;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
#hello{margin:-6px 0 2px;color:var(--muted);font-size:.9rem;font-weight:600}
#status{width:var(--board);padding:11px 14px;border-radius:16px;background:var(--panel);font-weight:800;text-align:center}
.who{width:var(--board);padding:0 6px;color:var(--muted);font-size:.85rem;font-weight:700}
#board{width:var(--board);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
border-radius:14px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.lt{background:var(--lt)}.dk{background:var(--dk)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(245,246,105,.5)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(245,246,105,.8)}
.sq.chk{background:radial-gradient(circle,#ff5a5a 20%,transparent 75%),var(--dk)}
.sq.dot::after{content:"";width:26%;height:26%;border-radius:50%;background:rgba(20,60,10,.3)}
.sq.cap::after{content:"";position:absolute;inset:4%;border-radius:50%;border:4px solid rgba(20,60,10,.3)}
.co{position:absolute;font-size:10px;font-weight:800;line-height:1;opacity:.75;pointer-events:none}
.co.r{top:3px;left:4px}.co.f{bottom:3px;right:4px}
.lt .co{color:var(--dk)}.dk .co{color:var(--lt)}
.pc{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.pc svg{width:90%;height:90%;fill:var(--pf);stroke:var(--ps);stroke-width:1.6;stroke-linejoin:round;
filter:url(#f3d) drop-shadow(0 3px 2px rgba(0,0,0,.38))}
.pc.w{--pf:url(#gw);--ps:#34312e;--eye:#34312e}
.pc.b{--pf:url(#gb);--ps:#0b0a09;--eye:#f2f2f2}
.e{fill:var(--eye);stroke:none}
.group{width:var(--board);display:flex;gap:8px;align-items:center}
.group>span{color:var(--muted);font-size:.85rem;font-weight:700;min-width:50px}
.seg{flex:1;display:flex;gap:6px}
button{font:inherit;font-weight:800;border:0;color:var(--text);background:var(--panel);border-radius:14px;padding:11px 6px;flex:1;cursor:pointer}
button.on{background:var(--accent);color:#14210a}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{width:var(--board);display:flex;gap:8px}
#new{background:var(--gold);color:#14210a;flex:2;padding:14px;font-size:1.02rem}
#undo{flex:1}

[hidden]{display:none!important}
.scr{width:var(--board);display:flex;flex-direction:column;gap:12px}
#home,#soon{padding-bottom:96px}
.top{display:flex;justify-content:space-between;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#14210a;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.hero{position:relative;overflow:hidden;border-radius:28px;background:var(--accent);color:#14210a;padding:22px;min-height:150px}
.hero small{font-weight:700;opacity:.8}.hero b{display:block;font-size:1.7rem;line-height:1.1;margin-top:6px}
.deco{position:absolute;right:-18px;top:16px;width:140px;height:140px;transform:rotate(14deg);border-radius:12px;background:conic-gradient(#769656 25%,#eeeed2 0 50%,#769656 0 75%,#eeeed2 0) 0 0/70px 70px}
.kk{position:absolute;right:30px;top:34px;width:84px;height:84px;transform:rotate(-8deg)}
.play{display:flex;justify-content:space-between;align-items:center;background:var(--gold);color:#14210a;padding:20px 22px;font-size:1.25rem;border-radius:26px;flex:none}
.play span{font-size:.95rem;opacity:.7}
h3{margin:4px 0 0;font-size:1.1rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border-radius:22px;padding:16px;font-weight:800;min-height:92px;color:#14210a;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer}
.card small{font-weight:600;opacity:.75}.card.soon{opacity:.55}
.c1{background:#769656}.c2{background:#5b8fb0}.c3{background:#b07a88}.c4{background:#a9a05c}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:var(--board);background:var(--panel);border-radius:26px;display:flex;padding:8px;gap:4px;z-index:5}
#nav button{background:none;display:flex;flex-direction:column;gap:2px;font-size:.7rem;padding:8px 2px;border-radius:18px;color:var(--muted)}
#nav button.on{background:var(--accent);color:#14210a}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar button{flex:none;padding:10px 14px}.mode{font-weight:800;font-size:.9rem;color:var(--muted)}
.pl{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:20px;padding:10px 12px;border:2px solid transparent}
.pl.act{border-color:var(--gold)}.pl .info{flex:1;min-width:0}.pl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl small{color:var(--muted);font-weight:700}
.clk{background:#1f3b27;padding:10px 14px;border-radius:14px;font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.pl.act .clk{background:#2ea36f}.clk.low{background:#8a2c2c!important}
#st{text-align:center;font-weight:800;color:var(--muted);min-height:1.2em}
.acts{display:flex;gap:8px}.acts button{display:flex;flex-direction:column;gap:2px;align-items:center;padding:12px 4px;font-size:.85rem}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#sheetbox{width:min(100vw,520px);background:var(--panel);border-radius:26px 26px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:12px;max-height:75vh;overflow:auto}
#sheetbox>b{font-size:1.3rem}.mvlist{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 14px;font-weight:700}
#sheetbox button{background:#3d3935}#sheetbox button.pri{background:var(--gold);color:#14210a}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:14px;font-weight:700;z-index:40}
.cf{position:fixed;top:-20px;width:8px;height:14px;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes boom{from{transform:scale(.2);opacity:1}to{transform:scale(1.7);opacity:0}}
.pc.mv{animation:pop .28s ease-out}
.sq.boom::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,230,120,.95),transparent 65%);animation:boom .5s ease-out forwards;z-index:2;pointer-events:none}
.center{text-align:center;padding:60px 10px;color:var(--muted);font-weight:700}
.pc img{width:94%;height:94%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4));pointer-events:none;-webkit-user-drag:none}
.credit{text-align:center;color:var(--muted);font-size:.7rem;opacity:.7;margin-top:6px}
.skg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sk{background:#3d3935;border-radius:14px;padding:8px 4px;text-align:center;border:2px solid transparent;cursor:pointer;display:flex;flex-wrap:wrap;justify-content:center}.sk.on{border-color:var(--gold)}.sk img{width:46%;filter:none}.sk small{width:100%;font-weight:700;font-size:.7rem;margin-top:4px}.sk i{display:block;width:100%;height:28px;border-radius:8px}

html{background:#1b1a18}
body{background:radial-gradient(120% 55% at 50% -8%,#47433d 0,#262421 55%,#1b1a18 100%) fixed}
.hero{background:linear-gradient(135deg,#9bd25f 0,#6fa63d 60%,#4f8a35 100%);box-shadow:0 10px 24px rgba(60,110,30,.35),inset 0 -6px 0 rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.4)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 0,rgba(255,255,255,.4),transparent 55%);pointer-events:none}
.hero small{color:#1f3a0c;opacity:.85;font-size:.95rem}.hero b{color:#12240a;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.kk{animation:float 3.2s ease-in-out infinite;z-index:2}
.kn{position:absolute;right:112px;bottom:8px;width:62px;height:62px;transform:rotate(8deg);z-index:2;animation:float2 3.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-9px)}}
@keyframes float2{0%,100%{transform:rotate(8deg) translateY(0)}50%{transform:rotate(4deg) translateY(-6px)}}
.play{background:linear-gradient(#a4d868,#7ab648);box-shadow:0 6px 0 #4f8330,0 14px 24px rgba(0,0,0,.38),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .08s,box-shadow .08s;animation:glow 2.6s ease-in-out infinite}
.play:active{transform:translateY(5px);box-shadow:0 1px 0 #4f8330}
.play b{display:flex;align-items:center;gap:10px}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.1)}}
.seg button,.acts button,.bar button{box-shadow:0 3px 0 rgba(0,0,0,.4);background:linear-gradient(#3d3935,#322f2b)}
.seg button.on{background:linear-gradient(#a4d868,#7ab648);box-shadow:0 3px 0 #4f8330}
.card{position:relative;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.3)}
.card::after{position:absolute;right:8px;bottom:2px;font-size:46px;opacity:.4}
.c1{background:linear-gradient(#8db565,#6b8f47)}.c1::after{content:"🤖"}
.c2{background:linear-gradient(#72a8cc,#4f84a8)}.c2::after{content:"🤝"}
.c3{background:linear-gradient(#cf95a3,#a96b7a)}.c3::after{content:"🏆"}
.c4{background:linear-gradient(#c6bd72,#9c9350)}.c4::after{content:"🎁"}
#nav{background:linear-gradient(#3b3733,#2c2926);box-shadow:0 -2px 24px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.08)}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{background:linear-gradient(#a4d868,#7ab648);box-shadow:0 3px 0 #4f8330}
#frame{width:var(--board);padding:10px;border-radius:20px;background:linear-gradient(145deg,#9a6532,#5c3a1a 55%,#4a2e14);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.4),0 14px 30px rgba(0,0,0,.55)}
#frame #board{width:100%;border-radius:8px;box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.pl{background:linear-gradient(#3d3935,#2f2c29);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.pl .av{box-shadow:0 0 0 3px rgba(255,255,255,.14)}.pl.act .av{box-shadow:0 0 0 3px var(--gold)}
.pl.act .clk{background:linear-gradient(#3ad193,#1f9a69);box-shadow:0 3px 0 #146e4a,0 0 18px rgba(52,196,135,.55)}
.pc img{filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}
@keyframes slide{from{transform:translate(calc(var(--dx)*100%),calc(var(--dy)*100%)) scale(1.08)}to{transform:none}}
.pc.mv{animation:slide .24s cubic-bezier(.2,.8,.2,1)}
.sq.top{z-index:6}
.hero small,.hero b{position:relative;z-index:1}
#nav button{flex:1;justify-content:center;align-items:center}

/* Daraja / Rang */
.group{flex-direction:column;align-items:stretch;gap:8px;background:var(--panel);border-radius:22px;padding:12px 12px 14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.group>span{min-width:0;padding-left:4px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.seg{gap:10px}
.seg button.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:74px;padding:10px 4px;border-radius:18px;background:linear-gradient(#403c38,#2e2b28);box-shadow:0 5px 0 #1a1816,inset 0 1px 0 rgba(255,255,255,.1);transition:transform .08s,box-shadow .08s}
.seg button.opt b{font-size:.9rem;line-height:1}
.seg button.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #1a1816,inset 0 1px 0 rgba(255,255,255,.1)}
.seg button.opt.on{background:linear-gradient(#a4d868,#7ab648);color:#14210a;box-shadow:0 5px 0 #4f8330,0 0 0 2px #c9ec9b,0 8px 18px rgba(129,182,76,.35)}
.seg button.opt.on:active{box-shadow:0 2px 0 #4f8330,0 0 0 2px #c9ec9b}
.opt .st{display:flex;gap:3px}
.opt .st svg{width:20px;height:20px;fill:#57534e;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.opt .st svg.f{fill:#ffc93c}
.opt.on .st svg{fill:rgba(20,33,10,.28);filter:none}
.opt.on .st svg.f{fill:#fff3b0;filter:drop-shadow(0 1px 0 rgba(120,80,0,.5))}

body.nobg::before{display:none}
#home,#soon{position:relative;z-index:1}
.seg button.opt{min-height:98px}
.opt img.sh{height:56px;width:auto;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));opacity:.88;transition:transform .15s}
.opt.on img.sh{opacity:1;transform:scale(1.1)}
.opt img.kt{height:62px;width:auto;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}

/* O'ynash tugmasi */
#play.play{display:block;position:relative;width:100%;padding:0;background:none;border-radius:0;box-shadow:none;font-size:1rem;animation:breathe 3.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
#play.play:active{transform:scale(.95);box-shadow:none}
.pbtn{display:block;width:100%;height:auto;pointer-events:none}
.pglow,.pcrown{position:absolute;pointer-events:none;mix-blend-mode:screen;animation:pulse 2.2s ease-in-out infinite alternate}
.pglow{inset:0;background:radial-gradient(40% 40% at 50% 55%,rgba(80,255,60,.3),transparent 70%)}
.pcrown{left:38%;top:8%;width:24%;height:32%;background:radial-gradient(circle,rgba(255,232,130,.75),transparent 70%);animation-duration:1.7s}
#play .ptxt{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:block;white-space:nowrap;font-size:clamp(1.5rem,8vw,2.3rem);font-weight:800;font-style:italic;background:linear-gradient(100deg,#fff6d6 0,#e8c76a 35%,#fff 50%,#e8c76a 65%,#fff6d6 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #5a3a00) drop-shadow(0 0 8px rgba(0,0,0,.6));animation:shine 3.2s linear infinite}
#play .pmin{position:absolute;left:50%;top:67%;transform:translateX(-50%);font-size:.72rem;font-weight:800;color:#d9f5c0;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes pulse{from{opacity:.35}to{opacity:1}}

.c2::after,.c3::after,.c4::after{content:none}
.card.soon{opacity:1;min-height:112px;justify-content:flex-start;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.85)}
.card.soon small{background:rgba(0,0,0,.55);color:#fff;opacity:1;padding:2px 9px;border-radius:10px;width:max-content;text-shadow:none;font-size:.7rem;margin-top:3px}
/* Daraja effekti (animatsiyasiz) */
.seg button.opt{position:relative}
.opt img.sh{position:relative;z-index:1;opacity:.72}
.opt::before{content:"";position:absolute;top:8px;left:50%;width:84px;height:84px;margin-left:-42px;border-radius:50%;background:radial-gradient(circle,var(--gl,transparent),transparent 68%);opacity:0}
.opt.on::before{opacity:.75}
.opt.on img.sh{opacity:1}
.opt[data-v="1"]{--gl:rgba(190,225,255,.95)}.opt[data-v="2"]{--gl:rgba(255,205,70,.95)}.opt[data-v="3"]{--gl:rgba(255,90,50,.95)}
.opt.on[data-v="1"] img.sh{filter:drop-shadow(0 0 9px rgba(190,225,255,.95)) drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.opt.on[data-v="2"] img.sh{filter:drop-shadow(0 0 9px rgba(255,205,70,.95)) drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.opt.on[data-v="3"] img.sh{filter:drop-shadow(0 0 9px rgba(255,90,50,.95)) drop-shadow(0 4px 4px rgba(0,0,0,.45))}

/* Kartalar animatsiyasi */
.c2,.c3,.c4{background-size:100% 100%,auto 125%;background-repeat:no-repeat;background-position:0 0,35% 50%;animation:pan 9s ease-in-out infinite alternate}
.c3{animation-delay:-3s}.c4{animation-delay:-6s}
.c2::after,.c3::after,.c4::after{content:"";position:absolute;inset:0;right:0;bottom:0;font-size:0;opacity:1;pointer-events:none;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);transform:translateX(-130%);animation:sweep 4.5s ease-in-out infinite}
.c3::after{animation-delay:1.2s}.c4::after{animation-delay:2.4s}
@keyframes pan{from{background-position:0 0,15% 50%}to{background-position:0 0,85% 50%}}
@keyframes sweep{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}

/* O'yin ekrani */
.pl .av.bav{background:#1d2b3d;padding:0}.bav img{width:100%;height:100%;object-fit:contain}
.bsh{height:40px;width:auto;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.capt{display:flex;align-items:center;min-height:20px;margin-top:2px;padding-left:4px}
.capt em{font-style:normal;font-weight:800;font-size:.78rem;color:#ffd35c;margin-left:10px}
.pcm{display:inline-block;width:18px!important;height:18px!important;margin-right:-6px;position:static!important;filter:none!important;transform:none!important;animation:none!important}
.pcm img,.pcm svg{width:100%;height:100%;display:block}
#frame{background:linear-gradient(145deg,#f7dc7a,#b8862b 50%,#f0cf68);padding:8px;box-shadow:0 0 0 2px #6b4a12,0 0 24px rgba(255,200,70,.4),0 12px 26px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.5)}
.sq.dot::after{width:30%;height:30%;background:rgba(255,205,70,.85);box-shadow:0 0 10px rgba(255,200,70,.9)}
.sq.cap::after{border:4px solid rgba(255,205,70,.9);box-shadow:0 0 12px rgba(255,200,70,.8)}
.res{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 0 4px}
.rimg{height:110px;width:auto;filter:drop-shadow(0 0 18px rgba(255,205,70,.9))}
.res.draw .rimg{filter:drop-shadow(0 0 16px rgba(190,225,255,.9))}.res.lose .rimg{filter:grayscale(.7) drop-shadow(0 0 10px rgba(255,90,50,.6))}
.rt{font-size:1.6rem}.res.win .rt{color:#ffd35c}.rw{color:var(--muted);font-weight:700}

/* Tugmalar, Shoh!, soat */
.acts button{background:linear-gradient(#4b4438,#2a2620)!important;box-shadow:0 4px 0 #120f0b,inset 0 1px 0 rgba(255,215,120,.4)!important;border:1px solid #8a6a25;color:#ffe9b0;transition:transform .08s,box-shadow .08s}
.acts button:active{transform:translateY(3px);box-shadow:0 1px 0 #120f0b!important}
.acts .ai{width:26px;height:26px;fill:none;stroke:#ffc93c;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(255,200,60,.5))}
.acts .half{font-style:normal;font-size:1.5rem;line-height:26px;font-weight:800;color:#ffc93c;text-shadow:0 0 6px rgba(255,200,60,.5)}
#rs .ai{stroke:#ff9a7a}#rs{color:#ffd0c4}
#frame{position:relative}
.fxb{position:absolute;left:50%;top:42%;z-index:6;pointer-events:none;font-size:2.4rem;font-weight:800;font-style:italic;color:#fff;background:linear-gradient(#ff7a5c,#d63b2a);padding:6px 26px;border-radius:16px;border:2px solid #ffd0c4;box-shadow:0 0 28px rgba(255,70,40,.8),0 6px 0 #7a1d12;text-shadow:0 2px 0 #7a1d12;animation:shoh 1.3s ease-out forwards}
@keyframes shoh{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.clk.low{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.55;box-shadow:0 0 16px rgba(255,60,60,.9)}}
.sq.last{box-shadow:inset 0 0 0 3px rgba(255,205,70,.8)}

/* Profil / Do'kon */
.chip{font-weight:800;background:linear-gradient(#3d3935,#2e2b28);padding:8px 14px;border-radius:16px;color:#ffd35c;box-shadow:0 3px 0 rgba(0,0,0,.4);flex:none;margin:0 auto}
#prof,#shop{position:relative;z-index:1;padding-bottom:96px}
.pcard{display:flex;align-items:center;gap:12px;background:linear-gradient(#3d3935,#2f2c29);border-radius:22px;padding:14px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.pcard .pn{flex:1;min-width:0}.pcard b{display:block;font-size:1.15rem}.pcard small{color:var(--muted);font-weight:700}
.av.big{width:60px;height:60px;font-size:1.5rem}
.coinb{background:#1f1b12;border:1px solid #8a6a25;color:#ffd35c;font-weight:800;padding:8px 14px;border-radius:14px}
.xpb{height:14px;border-radius:8px;background:#1f1d1a;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);overflow:hidden}
.xpb i{display:block;height:100%;border-radius:8px;background:linear-gradient(#a4d868,#6fa63d)}
.xpt{color:var(--muted);font-weight:700;text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--panel);border-radius:16px;padding:12px 4px;text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.stats b{display:block;font-size:1.4rem;color:#fff}
#fc{font:inherit;font-weight:800;text-align:center;letter-spacing:.2em;padding:12px;border-radius:14px;border:2px solid #3d3935;background:#262421;color:#fff;text-transform:uppercase}
.hint{color:var(--muted);font-weight:600;font-size:.82rem;line-height:1.4}
.sk.own{border-color:#81b64c}.sk.lk{opacity:.5}.sk .pr{color:#ffd35c}
.rew{color:#ffd35c;font-weight:800}
</style>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor('#262421'); tg.setBackgroundColor('#262421'); } catch (e) {}
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u && u.first_name) document.getElementById('hello').textContent = 'Salom, ' + u.first_name + '!';
}
const $ = id => document.getElementById(id);
const VAL = {p:100,n:320,b:330,r:500,q:900,k:0};
let game, me = 'w', level = 2, sel = null, targets = [], last = null, busy = false;
const LV = {1:'Oson',2:'O‘rta',3:'Qiyin'};
const U = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const NAME = (U && U.first_name) || 'Siz';
let online = false, oppName = '', mp = null, conn = null, prefMe = 'w';
let T = {w:900,b:900}, tick = null, over = true, snd = true, anim = false, AC = null;
function avatar(el){
  el.textContent = '';
  if (U && U.photo_url){ const i = new Image(); i.src = U.photo_url; i.onerror = () => { el.textContent = NAME[0]; }; el.appendChild(i); }
  else el.textContent = NAME[0];
}
function beep(f, d, t, v){
  if (!snd) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = t; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(AC.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d); o.stop(AC.currentTime + d);
  } catch (e) {}
}
function sound(m){ if (m && m.captured) beep(220, .14, 'triangle', .14); else beep(520, .07, 'sine', .09); }
function toast(t){ const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { e.hidden = true; }, 1800); }
function sheet(html, wire){ $('sheetbox').innerHTML = html; $('sheet').hidden = false; if (wire) wire(); }
function closeSheet(){ $('sheet').hidden = true; }
function show(n){ ['home','game','soon','prof','shop'].forEach(x => { $(x).hidden = x !== n; }); $('nav').hidden = n === 'game'; document.body.classList.toggle('nobg', n === 'game'); }
function fmt(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function clocks(){
  const bc = me === 'w' ? 'b' : 'w', t = game.turn();
  $('cm').textContent = fmt(T[me]); $('cb').textContent = fmt(T[bc]);
  $('plm').classList.toggle('act', !over && t === me); $('plb').classList.toggle('act', !over && t !== me);
  $('cm').classList.toggle('low', T[me] < 30); $('cb').classList.toggle('low', T[bc] < 30);
}
function runClock(){
  clearInterval(tick);
  tick = setInterval(() => {
    if (over) return;
    const c = game.turn(); T[c] -= .25; clocks();
    if (T[c] <= 0){ T[c] = 0; clocks(); finish(c === me ? 'lose' : 'win', 'Vaqt tugadi'); }
  }, 250);
}
function confetti(){
  const c = ['#81b64c','#f5e663','#8b7fd0','#ff7a7a','#5bb0e0'];
  for (let i = 0; i < 46; i++){
    const d = document.createElement('i'); d.className = 'cf';
    d.style.left = Math.random() * 100 + 'vw'; d.style.background = c[i % 5];
    d.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; d.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 4200);
  }
}
let PR = {xp:0, coins:0, g:0, w:0, d:0, l:0, ps:['cburnett'], ts:[0]};
try { Object.assign(PR, JSON.parse(localStorage.getItem('chessProf') || '{}')); } catch (e) {}
function plv(){ return Math.floor(PR.xp / 100) + 1; }
function chip(){ const c = $('chip'); if (c) c.textContent = 'Lv ' + plv() + ' · 🪙 ' + PR.coins; }
function saveProf(){ try { localStorage.setItem('chessProf', JSON.stringify(PR)); } catch (e) {} chip(); }
function reward(res){
  const xp = {win:30, draw:10, lose:5}[res] * (online ? 2 : level), co = {win:20, draw:5, lose:2}[res] * (online ? 2 : level), b = plv();
  PR.xp += xp; PR.coins += co; PR.g++; if (res === 'win') PR.w++; else if (res === 'draw') PR.d++; else PR.l++;
  saveProf(); return {xp, co, up: plv() > b};
}
function renderProf(){
  const x = PR.xp % 100;
  $('prof').innerHTML = '<div class="pcard"><span class="av big" id="avp"></span><div class="pn"><b>' + NAME + '</b><small>Daraja ' + plv() + '</small></div><span class="coinb">🪙 ' + PR.coins + '</span></div>'
    + '<div class="xpb"><i style="width:' + x + '%"></i></div><small class="xpt">' + x + ' / 100 XP</small>'
    + '<div class="stats"><div><b>' + PR.g + '</b>O‘yin</div><div><b>' + PR.w + '</b>Yutuq</div><div><b>' + PR.d + '</b>Durang</div><div><b>' + PR.l + '</b>Mag‘lubiyat</div></div>'
    + '<div class="hint">Yutish: +30 XP va +20 🪙, durang +10 XP va +5 🪙, yutqazish +5 XP va +2 🪙. Bot darajasi qiyin bo‘lsa, mukofot ko‘proq (O‘rta ×2, Qiyin ×3). Har 100 XP — yangi daraja. Tangalarni Do‘konda skinlarga sarflang.</div>';
  avatar($('avp'));
}
function buy(kind, key, price){
  const arr = kind === 'p' ? PR.ps : PR.ts;
  if (arr.includes(key)) return toast('Sizda bor');
  if (PR.coins < price) return toast('Tangalar yetmaydi');
  PR.coins -= price; arr.push(key); saveProf(); toast('Sotib olindi!'); renderShop();
}
function renderShop(){
  let h = '<div class="pcard"><div class="pn"><b>Do‘kon</b><small>Skinlarni tangaga oling</small></div><span class="coinb">🪙 ' + PR.coins + '</span></div><div>Donalar · 🪙 150</div><div class="skg">';
  SETS.forEach(x => { const o = PR.ps.includes(x[0]); h += '<div class="sk' + (o ? ' own' : '') + '" data-bp="' + x[0] + '"><img src="' + pbase(x[0]) + 'wN.svg" alt=""><img src="' + pbase(x[0]) + 'bQ.svg" alt=""><small>' + x[1] + '</small><small class="pr">' + (o ? 'Sizniki ✓' : '🪙 150') + '</small></div>'; });
  h += '</div><div>Taxta · 🪙 80</div><div class="skg">';
  THEMES.forEach((t, i) => { const o = PR.ts.includes(i); h += '<div class="sk' + (o ? ' own' : '') + '" data-bt="' + i + '"><i style="background:linear-gradient(90deg,' + t[1] + ' 50%,' + t[2] + ' 50%)"></i><small>' + t[0] + '</small><small class="pr">' + (o ? 'Sizniki ✓' : '🪙 80') + '</small></div>'; });
  $('shop').innerHTML = h + '</div>';
  document.querySelectorAll('#shop [data-bp]').forEach(e => { e.onclick = () => buy('p', e.dataset.bp, 150); });
  document.querySelectorAll('#shop [data-bt]').forEach(e => { e.onclick = () => buy('t', +e.dataset.bt, 80); });
}
function finish(res, why){
  if (over) return;
  over = true; busy = false; clearInterval(tick); render();
  const title = {win:'Siz yutdingiz!', lose:'Siz yutqazdingiz', draw:'Durang'}[res];
  const im = {win:shieldSrc(2), draw:shieldSrc(1), lose:shieldSrc(3)}[res];
  const rw = reward(res);
  const showR = () => sheet('<div class="res ' + res + '"><img class="rimg" alt="" src="' + im + '"><b class="rt">' + title + '</b><div class="rw">' + why + '</div><div class="rew">+' + rw.xp + ' XP · +' + rw.co + ' 🪙' + (rw.up ? ' · Yangi daraja: ' + plv() + '!' : '') + '</div></div><button class="pri" id="again">Yana o‘ynash</button><button id="menu">Bosh menyu</button>',
    () => { $('again').onclick = () => { online ? exitGame() : startGame(); }; $('menu').onclick = exitGame; });
  if (why === 'Mat'){ banner('Mat!'); setTimeout(showR, 1200); } else showR();
  if (res === 'win'){ confetti(); beep(660, .25, 'sine', .1); }
}
function checkEnd(){
  if (!game.game_over()) return false;
  if (game.in_checkmate()) finish(game.turn() === me ? 'lose' : 'win', 'Mat');
  else finish('draw', game.in_stalemate() ? 'Pat' : 'Durang');
  return true;
}
const SETS = [['cburnett','Klassik'],['staunty','Multfilm'],['merida','Merida'],['chessnut','Chessnut'],['maestro','Maestro'],['fresca','Fresca'],['gioco','Gioco'],['tatiana','Tatiana']];
const THEMES = [['Yashil','#eeeed2','#769656'],['Binafsha','#ebe8fa','#8b7fd0'],['Jigarrang','#f0d9b5','#b58863'],['Ko‘k','#dee3e6','#8ca2ad'],['Kulrang','#d9d9d9','#6b6b6b']];
let pieceSet = 'cburnett', themeI = 0, useImg = true;
try {
  const sv = JSON.parse(localStorage.getItem('chessSkin') || '{}');
  if (SETS.some(x => x[0] === sv.p)) pieceSet = sv.p;
  if (THEMES[sv.t]) themeI = sv.t;
} catch (e) {}
function saveSkin(){ try { localStorage.setItem('chessSkin', JSON.stringify({p:pieceSet, t:themeI})); } catch (e) {} }
function applyTheme(){ const t = THEMES[themeI], r = document.documentElement.style; r.setProperty('--lt', t[1]); r.setProperty('--dk', t[2]); }
function pbase(p){ return 'https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/' + (p || pieceSet) + '/'; }
function imgFail(){ if (useImg){ useImg = false; setKK(); if (game) render(); } }
function pieceHTML(c, t){
  return useImg ? '<img src="' + pbase() + c + t.toUpperCase() + '.svg" alt="" draggable="false" onerror="imgFail()">'
                : '<svg viewBox="0 0 45 45"><use href="#' + t.toUpperCase() + '"/></svg>';
}
function setKK(){ const k = document.querySelector('.kk'), n = document.querySelector('.kn'); if (k) k.innerHTML = pieceHTML('w', 'k'); if (n) n.innerHTML = pieceHTML('b', 'n'); }
applyTheme(); setKK();
function skins(){
  let a = '<b>Skinlar</b><div>Donalar</div><div class="skg">';
  SETS.forEach(x => { a += '<div class="sk' + (x[0] === pieceSet ? ' on' : '') + (PR.ps.includes(x[0]) ? '' : ' lk') + '" data-p="' + x[0] + '"><img src="' + pbase(x[0]) + 'wN.svg" alt=""><img src="' + pbase(x[0]) + 'bQ.svg" alt=""><small>' + x[1] + '</small></div>'; });
  a += '</div><div>Taxta</div><div class="skg">';
  THEMES.forEach((t, i) => { a += '<div class="sk' + (i === themeI ? ' on' : '') + (PR.ts.includes(i) ? '' : ' lk') + '" data-t="' + i + '"><i style="background:linear-gradient(90deg,' + t[1] + ' 50%,' + t[2] + ' 50%)"></i><small>' + t[0] + '</small></div>'; });
  a += '</div><button class="pri" id="ok">Tayyor</button>';
  sheet(a, () => {
    document.querySelectorAll('#sheetbox [data-p]').forEach(e => { e.onclick = () => { if (!PR.ps.includes(e.dataset.p)) return toast('Do‘konda sotib oling'); pieceSet = e.dataset.p; useImg = true; saveSkin(); setKK(); if (game) render(); skins(); }; });
    document.querySelectorAll('#sheetbox [data-t]').forEach(e => { e.onclick = () => { if (!PR.ts.includes(+e.dataset.t)) return toast('Do‘konda sotib oling'); themeI = +e.dataset.t; saveSkin(); applyTheme(); skins(); }; });
    $('ok').onclick = closeSheet;
  });
}
function capHTML(color){
  const cnt = {p:0,n:0,b:0,r:0,q:0}; game.board().forEach(r => r.forEach(p => { if (p && p.color === color && cnt[p.type] !== undefined) cnt[p.type]++; }));
  const full = {p:8,n:2,b:2,r:2,q:1}, pts = {p:1,n:3,b:3,r:5,q:9}; let h = '', sc = 0;
  for (const t of ['q','r','b','n','p']){ const m = Math.max(0, full[t] - cnt[t]); sc += m * pts[t]; for (let i = 0; i < m; i++) h += '<span class="pcm">' + pieceHTML(color, t) + '</span>'; }
  return {h, sc};
}
function shieldSrc(i){ const e = document.querySelectorAll('#lvl img.sh')[i - 1]; return e ? e.src : ''; }
function banner(t){
  const f = $('frame'); if (!f) return; const d = document.createElement('div'); d.className = 'fxb'; d.textContent = t; f.appendChild(d); setTimeout(() => d.remove(), 1300);
}
function render(){
  const el = $('board'); el.innerHTML = '';
  const b = game.board(), a = anim; anim = false;
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++){
    const r = me === 'w' ? i : 7 - i, c = me === 'w' ? j : 7 - j;
    const sq = 'abcdefgh'[c] + (8 - r), p = b[r][c];
    const d = document.createElement('div');
    d.className = 'sq ' + ((r + c) % 2 ? 'dk' : 'lt');
    if (last && (last.from === sq || last.to === sq)) d.classList.add('last');
    if (a && last && last.to === sq && last.captured) d.classList.add('boom');
    if (sel === sq) d.classList.add('sel');
    if (targets.includes(sq)) d.classList.add(p ? 'cap' : 'dot');
    if (p && p.type === 'k' && game.in_check() && game.turn() === p.color) d.classList.add('chk');
    let h = '';
    if (j === 0) h += '<span class="co r">' + (8 - r) + '</span>';
    if (i === 7) h += '<span class="co f">' + 'abcdefgh'[c] + '</span>';
    if (p){
      let st = '';
      if (a && last && last.to === sq){
        const ff = 'abcdefgh'.indexOf(last.from[0]), rr = 8 - parseInt(last.from[1]);
        st = ' style="--dx:' + ((me === 'w' ? ff : 7 - ff) - j) + ';--dy:' + ((me === 'w' ? rr : 7 - rr) - i) + '"';
        d.classList.add('top');
      }
      h += '<span class="pc ' + p.color + (st ? ' mv' : '') + '"' + st + '>' + pieceHTML(p.color, p.type) + '</span>';
    }
    d.innerHTML = h; d.onclick = () => tap(sq); el.appendChild(d);
  }
  $('bn').textContent = online ? oppName : 'Bot'; $('bs').textContent = (me === 'w' ? 'Qora' : 'Oq') + (online ? '' : ' · ' + LV[level]);
  $('mn').textContent = NAME; $('ms').textContent = me === 'w' ? 'Oq' : 'Qora';
  $('st').textContent = over ? '' : busy ? 'Bot o‘ylayapti…' : game.turn() === me ? (game.in_check() ? 'Shoh ostida!' : 'Sizning yurishingiz') : (online ? 'Raqib yurmoqda…' : '');
  if (a && !over && game.in_check()) banner('Shoh!');
  const lost = capHTML(me), won = capHTML(me === 'w' ? 'b' : 'w');
  $('capm').innerHTML = won.h + (won.sc > lost.sc ? '<em>+' + (won.sc - lost.sc) + '</em>' : '');
  $('capb').innerHTML = lost.h + (lost.sc > won.sc ? '<em>+' + (lost.sc - won.sc) + '</em>' : '');
  $('bsh').src = shieldSrc(level);
  clocks();
}
function tap(sq){
  if (over || busy || game.turn() !== me) return;
  const p = game.get(sq);
  if (sel && targets.includes(sq)) return play(sel, sq);
  if (p && p.color === me){ sel = sq; targets = game.moves({square:sq, verbose:true}).map(m => m.to); }
  else { sel = null; targets = []; }
  render();
}
function play(f, t){
  const m = game.move({from:f, to:t, promotion:'q'});
  if (!m) return;
  last = m; sel = null; targets = []; anim = true; sound(m);
  if (tg && tg.HapticFeedback) try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  if (online) send({t:'mv', f:f, o:t});
  if (!checkEnd()){ render(); if (!online) botTurn(); }
}

/* Bot: negamax + alpha-beta, vaqt bilan cheklangan */
let dl = 0, nodes = 0, timeUp = false;
function evaluate(g){
  let s = 0; const B = g.board();
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++){
    const p = B[r][f]; if (!p) continue;
    let v = VAL[p.type]; const c = 3.5 - Math.abs(f - 3.5), d = 3.5 - Math.abs(r - 3.5);
    if (p.type === 'p'){ const a = p.color === 'w' ? 6 - r : r - 1; v += a * 8 + (f > 1 && f < 6 ? a * 2 : 0); }
    else if (p.type === 'n' || p.type === 'b') v += (c + d) * 6;
    else if (p.type === 'q') v += (c + d) * 2;
    s += p.color === 'w' ? v : -v;
  }
  return s;
}
function msc(m){ return (m.captured ? 10 * VAL[m.captured] - VAL[m.piece] / 10 : 0) + (m.promotion ? 800 : 0) + (m.san.indexOf('+') > 0 ? 50 : 0); }
function ordered(ms){ return ms.sort((a, b) => msc(b) - msc(a)); }
function mk(m){ return game.move({from:m.from, to:m.to, promotion:m.promotion || 'q'}); }
function ab(d, a, b, ply){
  if ((++nodes & 127) === 0 && Date.now() > dl) timeUp = true;
  if (timeUp) return 0;
  const ms = game.moves({verbose:true});
  if (!ms.length) return game.in_check() ? -(30000 - ply) : 0;
  if (d === 0) return evaluate(game) * (game.turn() === 'w' ? 1 : -1);
  let best = -Infinity;
  for (const m of ordered(ms)){
    mk(m); const v = -ab(d - 1, -b, -a, ply + 1); game.undo();
    if (timeUp) return 0;
    if (v > best) best = v; if (v > a) a = v; if (a >= b) break;
  }
  return best;
}
function botMove(){
  const ms = game.moves({verbose:true}); if (!ms.length) return;
  let pick = null;
  if (level === 1 && Math.random() < .3) pick = ms[Math.random() * ms.length | 0];
  else {
    const maxD = level === 1 ? 1 : level === 2 ? 2 : 4, noise = level === 1 ? 120 : level === 2 ? 25 : 0;
    dl = Date.now() + (level === 3 ? 900 : level === 2 ? 500 : 200); timeUp = false; nodes = 0;
    let list = ordered(ms.slice());
    for (let d = 1; d <= maxD; d++){
      let res = [], alpha = -Infinity;
      for (const m of list){
        mk(m); const v = -ab(d - 1, -Infinity, -alpha, 1); game.undo();
        if (timeUp) break;
        res.push([m, v]); if (noise === 0 && v > alpha) alpha = v;
      }
      if (timeUp) break;
      res.sort((x, y) => y[1] - x[1]);
      pick = res.reduce((bst, x) => (x[1] + Math.random() * noise > bst[1] + Math.random() * noise ? x : bst), res[0])[0];
      list = res.map(x => x[0]);
    }
    if (!pick) pick = list[0];
  }
  last = mk(pick);
}
function botTurn(){
  busy = true; render();
  setTimeout(() => {
    if (over) return;
    botMove(); anim = true; sound(last); busy = false;
    if (!checkEnd()) render();
  }, 200);
}
function startGame(){
  online = false; closeConn(); closeSheet(); T = {w:900, b:900}; over = false;
  game = new Chess(); sel = null; targets = []; last = null; busy = false;
  show('game'); avatar($('av2')); runClock();
  if (me === 'b') botTurn(); else render();
}
function exitGame(){ over = true; if (online){ online = false; me = prefMe; } closeConn(); clearInterval(tick); closeSheet(); show('home'); }
function confirmResign(){
  sheet('<b>Taslim bo‘lasizmi?</b><div>O‘yin yutqazish bilan tugaydi.</div><button class="pri" id="yes">Ha, taslim</button><button id="no">Yo‘q, davom etaman</button>',
    () => { $('yes').onclick = () => { closeSheet(); if (online) send({t:'rs'}); finish('lose', 'Siz taslim bo‘ldingiz'); }; $('no').onclick = closeSheet; });
}

/* Do'st bilan online (PeerJS) */
function send(d){ try { if (conn && conn.open) conn.send(d); } catch (e) {} }
function closeConn(){ const c = conn, p = mp; conn = null; mp = null; try { c && c.close(); } catch (e) {} try { p && p.destroy(); } catch (e) {} }
function wire(c, col){
  conn = c;
  const hi = () => c.send({t:'hi', n:NAME});
  if (c.open) hi(); else c.on('open', hi);
  c.on('data', d => { if (d.t === 'hi'){ if (!online) startOnline(col, d.n || 'Do‘st'); } else onMsg(d); });
  c.on('close', () => { if (online && !over) finish('win', 'Raqib chiqib ketdi'); });
}
function startOnline(col, name){
  prefMe = me; closeSheet(); online = true; oppName = name; me = col; T = {w:900, b:900}; over = false;
  game = new Chess(); sel = null; targets = []; last = null; busy = false;
  show('game'); avatar($('av2')); runClock(); render();
}
function onMsg(d){
  if (d.t === 'mv'){
    if (over) return;
    const m = game.move({from:d.f, to:d.o, promotion:'q'}); if (!m) return;
    last = m; sel = null; targets = []; anim = true; sound(m);
    if (!checkEnd()) render();
  } else if (d.t === 'rs') finish('win', 'Raqib taslim bo‘ldi');
  else if (d.t === 'da') finish('draw', 'Durang kelishildi');
  else if (d.t === 'dr') sheet('<b>Raqib durang taklif qildi</b><button class="pri" id="y1">Qabul qilish</button><button id="n1">Rad etish</button>',
    () => { $('y1').onclick = () => { send({t:'da'}); closeSheet(); finish('draw', 'Durang kelishildi'); }; $('n1').onclick = closeSheet; });
}
function hostGame(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', code = Array.from({length:5}, () => A[Math.random() * 32 | 0]).join('');
  closeConn(); mp = new Peer('shx-' + code);
  mp.on('open', () => sheet('<b>Do‘stingizni kuting ⏳</b><div>Kod: <b style="font-size:2rem;letter-spacing:.2em">' + code + '</b></div><button class="pri" id="shr">Telegramda yuborish</button><button id="no">Bekor qilish</button>',
    () => { $('shr').onclick = () => shareCode(code); $('no').onclick = () => { closeSheet(); closeConn(); }; }));
  mp.on('connection', c => { if (conn) { c.close(); return; } wire(c, 'w'); });
  mp.on('error', e => { if (e.type === 'unavailable-id') hostGame(); else toast('Ulanish xatosi'); });
}
function joinGame(code){
  if (code.length < 5) return toast('Kodni to‘liq kiriting');
  closeConn(); toast('Ulanmoqda…'); mp = new Peer();
  mp.on('open', () => { wire(mp.connect('shx-' + code.toUpperCase(), {reliable:true}), 'b'); setTimeout(() => { if (!online) toast('Ulanib bo‘lmadi'); }, 12000); });
  mp.on('error', () => toast('Kod noto‘g‘ri yoki do‘st tayyor emas'));
}
function shareCode(code){
  const txt = '♟️ Shaxmat o‘ynaymiz! @daulet_chess_bot ni oching → Do‘st bilan → Kod bilan qo‘shilish. Kod: ' + code;
  const u = 'https://t.me/share/url?url=' + encodeURIComponent('https://t.me/daulet_chess_bot') + '&text=' + encodeURIComponent(txt);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(u); else window.open(u, '_blank');
}
function friendSheet(){
  sheet('<b>Do‘st bilan o‘ynash</b><button class="pri" id="fh">Yangi o‘yin ochish</button><input id="fc" placeholder="DO‘ST KODI" maxlength="5" autocapitalize="characters"><button id="fj">Kod bilan qo‘shilish</button><button id="fx">Yopish</button>',
    () => { $('fh').onclick = hostGame; $('fj').onclick = () => joinGame($('fc').value.trim()); $('fx').onclick = closeSheet; });
}
$('cfr').onclick = friendSheet;
$('play').onclick = startGame;
$('cbot').onclick = startGame;
document.querySelectorAll('[data-soon]').forEach(c => { c.onclick = () => toast('Tez orada qo‘shiladi'); });
$('back').onclick = () => { if (over || !game.history().length) exitGame(); else confirmResign(); };
$('rs').onclick = () => { if (!over) confirmResign(); };
$('dr').onclick = () => {
  if (over || busy) return;
  if (online){ send({t:'dr'}); return toast('Durang taklif qilindi'); }
  if (game.history().length < 10){ toast('Bot: hali erta'); return; }
  const e = evaluate(game) * (me === 'w' ? -1 : 1);
  if (e < 80) finish('draw', 'Bot durangni qabul qildi'); else toast('Bot durangni rad etdi');
};
$('mv').onclick = () => {
  const h = game.history(); let r = '';
  for (let i = 0; i < h.length; i += 2) r += '<span>' + (i / 2 + 1) + '.</span><span>' + h[i] + '</span><span>' + (h[i + 1] || '') + '</span>';
  sheet('<b>Yurishlar</b><div class="mvlist">' + (r || '<span></span><span>Hali yurish yo‘q</span>') + '</div><button id="ok">Yopish</button>', () => { $('ok').onclick = closeSheet; });
};
$('snd').onclick = () => { snd = !snd; $('snd').textContent = snd ? '🔊' : '🔇'; };
document.querySelectorAll('#nav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x === b));
    if (b.dataset.s === 'O‘yin') show('home'); else if (b.dataset.s === 'Profil'){ renderProf(); show('prof'); } else if (b.dataset.s.indexOf('kon') > 0){ renderShop(); show('shop'); } else { $('soonT').textContent = b.dataset.s; show('soon'); }
  };
});
function mark(box, v){ box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(v))); }
$('lvl').onclick = e => { const v = (e.target.closest('button')||{dataset:{}}).dataset.v; if (!v) return; level = +v; mark($('lvl'), level); };
$('clr').onclick = e => { const v = (e.target.closest('button')||{dataset:{}}).dataset.v; if (!v) return; me = v; mark($('clr'), me); };
mark($('lvl'), level); mark($('clr'), me); avatar($('avh'));
if (!PR.ps.includes(pieceSet)) PR.ps.push(pieceSet); if (!PR.ts.includes(themeI)) PR.ts.push(themeI); saveProf();
$('skins').onclick = skins; $('sk2').onclick = skins;
game = new Chess();
</script>
